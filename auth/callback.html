<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- SECURITY BOUNDARY (task 51774). The email link carries a one-time token in the query string. Nothing that can
     leak it may load before it is removed from the URL, so, in this order:
       1. no-referrer policy (also stops the URL being sent as a Referer by anything that loads later);
       2. an inline script that copies the allow-listed values into a closure and calls history.replaceState;
       3. only then the first-party module. There are NO external scripts, styles, fonts, favicons or trackers on
          this page. The token is never written to any storage and never logged.
     The token is exchanged only when the user presses the button (email scanners that GET the link must not
     consume it). -->
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex, nofollow" />
<title>Imoten Radar - account</title>
<script>
(function () {
  var taken = null;
  try {
    var q = new URLSearchParams(window.location.search);
    var type = q.get('auth_type');
    var hash = q.get('token_hash');
    var typeOk = type === 'signup' || type === 'recovery' || type === 'email_change';
    if (typeOk && hash && /^[A-Za-z0-9_-]{16,128}$/.test(hash)) {
      taken = { type: type, tokenHash: hash };
    }
  } catch (e) { taken = null; }
  // Remove ALL credential-bearing parts (query and fragment) before anything else runs.
  try { window.history.replaceState(null, '', window.location.pathname); } catch (e) {}
  // One-shot getter: the first-party module reads it once, then it is empty.
  window.__imotenAuthCallback = {
    take: function () { var v = taken; taken = null; return v; }
  };
})();
</script>

    <label for="cbNewPassword2">Repeat new password</label>
    <input type="password" id="cbNewPassword2" autocomplete="new-password" />
    <button type="submit" id="cbPasswordSubmit">Set new password</button>
    <button type="button" class="secondary" id="cbPasswordCancel">Cancel</button>
  </form>

  <div id="cbDone" hidden>
    <button type="button" id="cbHomeBtn">Continue to Imoten Radar</button>
  </div>

  </div>
