# NOTE (data-store migration): data now moves through apps/scraper/data_store.py (GitHub Release assets), not git. Comments
# below that mention git push / rebase / "ours" describe the OLD mechanism and are kept only as history.
# Fills in lat/lng and description for bazar.bg listings the nationwide
# scraper left unenriched (see backfill_detail_bazar.py and
# scraper_bazar.py's module docstring for why: visiting every listing's
# own detail page at nationwide scale doesn't fit in the scrape itself).
# Previously workflow_dispatch-only (map coordinates alone didn't justify
# an hourly cron) - now scheduled hourly like the other detail backfills,
# since it also fills in description, real listing content users actually
# see. Own dedicated concurrency group, not shared with scrape.yml or the
# other backfills - a shared group only ever keeps one *queued* run, so
# with this many hourly-ish backfill/geocode workflows funneling into one
# slot, a later schedule firing while an earlier one was still queued
# canceled it outright rather than just delaying it (confirmed live: runs
# were being canceled every few minutes). Any git push race with a
# concurrent scrape/backfill is handled by the rebase-retry fallback below
# - a real merge for data/history*.json(.gz), see merge_history_conflict.py
# - not the old keep-one-side-only "ours" fallback that used to silently
# discard this run's own scraped lat/lng/description on every conflict
# against scrape.yml's own 6-hourly runs (see docs/backlog.md item 3's
# addendum: this was the one detail-backfill workflow never upgraded when
# alo.bg/homes.bg/imoti.net's own versions of this bug were fixed, and
# data/leads_bazar.json/history_bazar.json being gzip binaries since PR
# #298 made every conflict here a guaranteed hard binary conflict - always
# hitting the discard path, not just sometimes).
name: Backfill bazar.bg listing details

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: backfill-detail-bazar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      # Data lives in the data-store release (not in git): see apps/scraper/data_store.py
      - id: pull
        run: python apps/scraper/data_store.py pull @bazar @geocode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: python apps/scraper/backfill_detail_bazar.py
        timeout-minutes: 45

      # Per-run backup of what this run pulled + wrote (the release only keeps the latest copy).
      - if: always() && steps.pull.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: data-backup-${{ github.run_id }}
          path: |
            data/*.json*
            !data/bg_*.json
          retention-days: 7
          if-no-files-found: warn

      # Replaces the old git add/commit/rebase/push block: data_store.py merges history files if another
      # workflow uploaded in between, skips files that did not change, and fails loudly with the HTTP body.
      - if: always() && steps.pull.outcome == 'success'
        run: python apps/scraper/data_store.py push @bazar @geocode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
