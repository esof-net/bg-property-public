# NOTE (data-store migration): data now moves through apps/scraper/data_store.py (GitHub Release assets), not git. Comments
# below that mention git push / rebase / "ours" describe the OLD mechanism and are kept only as history.
# One-time backfill (see backfill_wayback_prices.py for the full rationale
# and how it was arrived at): injects real pre-tracking price history for
# imot.bg and bazar.bg listings from Wayback Machine captures of each
# portal's search page, confirmed to have real overlap with our currently
# tracked listings. workflow_dispatch only - not scheduled, since Wayback
# doesn't crawl more often just because this re-runs. Own dedicated
# concurrency group, not shared with scrape.yml or the other backfills -
# a shared group only ever keeps one *queued* run, so with this many
# hourly-ish backfill/geocode workflows funneling into one slot, a later
# schedule firing while an earlier one was still queued canceled it
# outright rather than just delaying it (confirmed live: runs were being
# canceled every few minutes). Any git push race with a concurrent
# scrape/backfill is already handled by the rebase-retry-with-ours
# fallback below, same as always.
name: Backfill Wayback price history

on:
  workflow_dispatch:

concurrency:
  group: backfill-wayback-prices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      # Data lives in the data-store release (not in git): see apps/scraper/data_store.py
      - id: pull
        run: python apps/scraper/data_store.py pull @bazar @imot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: python apps/scraper/backfill_wayback_prices.py

      # Per-run backup of what this run pulled + wrote (the release only keeps the latest copy).
      - if: always() && steps.pull.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: data-backup-${{ github.run_id }}
          path: |
            data/*.json*
            !data/bg_*.json
          retention-days: 7
          if-no-files-found: warn

      # Replaces the old git add/commit/rebase/push block: data_store.py merges history files if another
      # workflow uploaded in between, skips files that did not change, and fails loudly with the HTTP body.
      # if: always() - a prior run wrote 34 real injected snapshots to the history files, then crashed on an
      # unrelated step before the old commit step ran, silently losing that work. Pushing whatever is on disk
      # regardless of later failures is strictly safer than losing it.
      - if: always() && steps.pull.outcome == 'success'
        run: python apps/scraper/data_store.py push @bazar @imot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
